# linht-chargerd configuration. key = value, # starts a comment.
# A missing key keeps the built-in default shown here.

# Charger on I2C.
i2c_dev = /dev/i2c-2
i2c_addr = 0x6b

# PFM in forward mode. off writes PFM_FWD_DIS = 1 (forced PWM). On Rev C
# PFM off is 2.9 dB quieter with a full battery on USB and 1.0 dB while
# charging. On Rev B PFM on is 0.7 to 0.9 dB better, use "pfm = on" there.
pfm = off

# full-hold: with a full battery on USB, go to HIZ and run from the
# battery until the SoC falls to full_hold_resume_soc, then charge again.
# Quiet most of the time on a bench, costs shallow cycles. Not tested yet.
full_hold = off
full_hold_resume_soc = 90

# Quiet leases (HIZ). The limits apply on USB only.
quiet_max_s = 300
quiet_min_soc = 25        # new leases refused below
quiet_end_soc = 20        # all leases end, charging resumes
quiet_resume_soc = 40     # leases allowed again after a low battery end
quiet_min_vbat = 7.3      # V, used instead while the SoC is not trusted
quiet_end_vbat = 7.1      # V

# LowBattery signal on battery. critical_soc is also the end of the
# remaining run time.
low_soc = 15
critical_soc = 5

# Battery pack, from the label. A new chassis or pack changes only this.
battery = Retevis C62 2S Li-ion
cells = 2
capacity_rated_wh = 14.8
capacity_rated_mah = 2000
