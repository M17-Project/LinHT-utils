# linht-gnssd configuration. key = value, # starts a comment.
# A missing key keeps the built-in default shown here.

# Receiver UART: LPUART3, 9600 8N1 is the LG77L default.
device = /dev/ttyLP2
baud = 9600

# Sentences older than this are not used (at least 2.5 fix intervals).
stale_s = 5

# Watchdog: no valid NMEA for watchdog_s (at least 2.5 fix intervals) opens
# the tty again. After reset_after_reopens such reopens in a row a RESET_N
# pulse follows, at most once per reset_min_interval_s.
watchdog_s = 10
watchdog_reset = on
reset_after_reopens = 3
reset_min_interval_s = 600

# RESET_N of the LG77L: SoM pin 83, GPIO4_IO03 = gpiochip2 line 3 on Rev B
# and Rev C. reset_line = -1 turns it off. The module needs at least 100 ms.
# WAKEUP (GPIO4_IO02) is never driven, see the README.
reset_chip = /dev/gpiochip2
reset_line = 3
reset_ms = 150

# PositionChanged at most this often while there is a fix.
position_interval_s = 5

# NMEA pass-through. Empty turns a part off.
pty_link = /run/linht-gnssd/nmea
socket = /run/linht-gnssd/nmea.sock
feed_group = dialout

# SendCommand (raw PMTK/PQ commands, root only). Off in normal use.
send_command = off

# Time from GNSS. Only a stable 3D fix with at least 4 satellites and a
# sane date counts. The two choices are separate:
#
# system_clock: auto steps the system clock when it is before the build
# year or differs from the receiver by more than time_sync_threshold_s,
# unless NTP (timesyncd, chrony) keeps it synchronised. always steps it also against NTP. off
# never touches it.
#
# rtc: on writes rtc_device with the GNSS time at the first stable fix,
# after each step and then once per hour, also with system_clock = off.
# off never writes it. When NTP keeps the system clock and it differs from
# GNSS by more than the threshold, nothing is stepped or written (not in
# always mode).
#
# rtc_device is the battery-backed AB1805, rtc1 on the current LinHT image
# (rtc0 is the BBNSM of the SoC, not backed). Empty = no RTC writes.
# time_sync_delay_ms is the receiver delay from the start of the second to
# the first byte of RMC, measured once on Rev C (see the README).
system_clock = auto
rtc = on
time_sync_threshold_s = 2
time_sync_delay_ms = 125
rtc_device = /dev/rtc1
