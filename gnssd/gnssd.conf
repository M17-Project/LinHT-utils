# linht-gnssd configuration. key = value, # starts a comment.
# A missing key keeps the built-in default shown here.

# Receiver UART: LPUART3, 9600 8N1 is the LG77L default.
device = /dev/ttyLP2
baud = 9600

# Sentences older than this are not used (at least 2.5 fix intervals).
stale_s = 5

# Watchdog: no valid NMEA for watchdog_s (at least 2.5 fix intervals) opens
# the tty again. After reset_after_reopens such reopens in a row a RESET_N
# pulse follows, at most once per reset_min_interval_s.
watchdog_s = 10
watchdog_reset = on
reset_after_reopens = 3
reset_min_interval_s = 600

# RESET_N of the LG77L: SoM pin 83, GPIO4_IO03 = gpiochip2 line 3 on Rev B
# and Rev C. reset_line = -1 turns it off. The module needs at least 100 ms.
# WAKEUP (GPIO4_IO02) is never driven, see the README.
reset_chip = /dev/gpiochip2
reset_line = 3
reset_ms = 150

# PositionChanged at most this often while there is a fix.
position_interval_s = 5

# NMEA pass-through. Empty turns a part off.
pty_link = /run/linht-gnssd/nmea
socket = /run/linht-gnssd/nmea.sock
feed_group = dialout

# SendCommand (raw PMTK/PQ commands, root only). Off in normal use.
send_command = off
