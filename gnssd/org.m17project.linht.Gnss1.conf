<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- linht-gnssd: only root owns the name. Everyone reads the
     properties. Root and the group plugdev call Standby, Wake, Restart
     and SetUpdateRate. SendCommand is for root only, and the daemon also
     needs send_command = on in /etc/linht/gnssd.conf. -->
<busconfig>
  <policy user="root">
    <allow own="org.m17project.linht.Gnss1"/>
    <allow send_destination="org.m17project.linht.Gnss1"/>
  </policy>

  <policy group="plugdev">
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.m17project.linht.Gnss1" send_member="Standby"/>
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.m17project.linht.Gnss1" send_member="Wake"/>
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.m17project.linht.Gnss1" send_member="Restart"/>
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.m17project.linht.Gnss1" send_member="SetUpdateRate"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.m17project.linht.Gnss1"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
  </policy>
</busconfig>
